<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="VitalLens — a personal wellness journal. Scan food, log daily habits, and explore patterns in your own data.">
  <meta name="theme-color" content="#F5F0E8">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-title" content="VitalLens">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>VitalLens — Personal Wellness Journal</title>
  <!-- Social previews (LinkedIn, iMessage, Slack, X) read these; the app itself is client-rendered. -->
  <link rel="canonical" href="https://vitallens-app.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VitalLens">
  <meta property="og:title" content="VitalLens — AI-Assisted Wellness Journal">
  <meta property="og:description" content="Scan meals, log sleep and habits, and see honest patterns from your own data. A private, installable wellness journal.">
  <meta property="og:url" content="https://vitallens-app.vercel.app/">
  <meta property="og:image" content="https://vitallens-app.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="VitalLens app: dashboard on a phone next to the tagline">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VitalLens — AI-Assisted Wellness Journal">
  <meta name="twitter:description" content="Scan meals, log sleep and habits, and see honest patterns from your own data.">
  <meta name="twitter:image" content="https://vitallens-app.vercel.app/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/variables.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/animations.css">
  <link rel="stylesheet" href="src/styles/utilities.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'><path d='M12 55h20l10-24 16 44 12-30 8 10h10' stroke='%231A55CC' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <div id="app">
    <main id="page-content" tabindex="-1"></main>
    <nav id="bottom-nav" aria-label="Primary"></nav>
  </div>
  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- PostHog analytics loads from src/utils/analytics-events.js when
       VITE_POSTHOG_KEY is set in the environment. No key = fully disabled. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
