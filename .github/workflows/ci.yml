name: CI (frontend)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Regulatory guard — fails the build if disease/diagnostic language
      # creeps into user-facing copy. Keeps the wellness framing airtight.
      - name: Regulatory-language check
        run: node scripts/check-regulatory-language.mjs
      - name: Production build
        run: npm run build
