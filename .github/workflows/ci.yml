name: CI (frontend)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # Regulatory guard — fails the build if disease/diagnostic language
      # creeps into user-facing copy. Keeps the wellness framing airtight.
      - name: Regulatory-language check
        run: node scripts/check-regulatory-language.mjs
      - name: Production build
        run: npm run build
